<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>GOCHILLA — RISE FROM THE DEEP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Russo+One&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Russo One',sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#size-label{position:absolute;top:12px;left:12px;color:#0ff;font-size:13px;letter-spacing:2px;text-shadow:0 0 8px #0ff}
#size-bar-bg{position:absolute;top:32px;left:12px;width:180px;height:12px;border:2px solid #0ff;background:rgba(0,0,0,.6);box-shadow:0 0 10px rgba(0,255,255,.3);border-radius:6px}
#size-bar{height:100%;width:0%;background:linear-gradient(90deg,#004466,#00ffff);border-radius:4px;transition:width .3s}
#food-count{position:absolute;top:50px;left:12px;color:#0f8;font-size:11px;letter-spacing:2px;text-shadow:0 0 6px #0f8}
#depth-display{position:absolute;top:12px;right:12px;color:rgba(255,255,255,.7);font-size:11px;letter-spacing:1px;text-align:right}
#creature-label{position:absolute;bottom:160px;left:50%;transform:translateX(-50%);color:#0ff;font-size:14px;text-shadow:0 0 10px #0ff;letter-spacing:2px;opacity:0;transition:opacity .5s;text-align:center}
#stage-announce{position:fixed;top:35%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#ff0040;text-shadow:0 0 30px #ff0040,0 0 60px #ff0040;letter-spacing:4px;opacity:0;transition:opacity .8s;pointer-events:none;z-index:20;text-align:center;line-height:1.6}
#joystick-zone{position:fixed;bottom:0;left:0;width:40%;height:40%;z-index:30;pointer-events:all;display:none}
#joystick-zone.active,#camera-zone.active,.swim-btn.active{display:flex}
#joystick-base{position:absolute;bottom:40px;left:40px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.15)}
#joystick-thumb{position:absolute;bottom:75px;left:75px;width:50px;height:50px;border-radius:50%;background:rgba(0,255,255,.25);border:2px solid rgba(0,255,255,.4);transform:translate(-50%,-50%)}
.swim-btn{position:fixed;right:30px;width:64px;height:64px;border-radius:50%;z-index:30;pointer-events:all;display:none;align-items:center;justify-content:center;font-size:20px;letter-spacing:1px;font-family:'Russo One',sans-serif}
#swim-up-btn{bottom:124px;background:rgba(0,200,255,.12);border:2px solid rgba(0,200,255,.3);color:rgba(0,200,255,.7)}
#swim-down-btn{bottom:50px;background:rgba(255,120,0,.12);border:2px solid rgba(255,120,0,.3);color:rgba(255,120,0,.7)}
#camera-zone{position:fixed;top:0;right:0;width:55%;height:100%;z-index:25;pointer-events:all;display:none}
#title-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center bottom,#1a0040 0%,#000 70%);z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:all;cursor:pointer}
#title-screen h1{font-size:min(56px,12vw);color:#0ff;text-shadow:0 0 30px #0ff,0 0 60px #0088ff,3px 3px 0 #000;letter-spacing:6px}
#title-screen h2{font-size:min(18px,4vw);color:#ff0040;margin-top:6px;text-shadow:0 0 15px #ff0040;letter-spacing:8px}
#title-screen .sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:40px;letter-spacing:2px;text-align:center;padding:0 20px}
#title-screen .start{font-size:16px;color:#fff;margin-top:20px;animation:blink 1s step-end infinite;letter-spacing:4px}
@keyframes blink{50%{opacity:0}}
</style>
</head>
<body>
<div id="ui">
  <div id="size-label">SIZE: LARVA</div>
  <div id="size-bar-bg"><div id="size-bar"></div></div>
  <div id="food-count">CONSUMED: 0</div>
  <div id="depth-display"></div>
  <div id="creature-label"></div>
</div>
<div id="stage-announce"></div>
<div id="joystick-zone"><div id="joystick-base"><div id="joystick-thumb"></div></div></div>
<div id="camera-zone"></div>
<button class="swim-btn" id="swim-up-btn">&#9650;</button>
<button class="swim-btn" id="swim-down-btn">&#9660;</button>
<div id="title-screen" onclick="window._startGame&&window._startGame()" ontouchend="window._startGame&&window._startGame()">
  <h1>GOCHILLA</h1>
  <h2>RISE FROM THE DEEP</h2>
  <div class="sub">START AS A LARVA ON THE OCEAN FLOOR<br>EAT EVERYTHING — GROW INTO A LEVIATHAN<br>SURFACE AND DESTROY THE CITY</div>
  <div class="start">TAP TO BEGIN</div>
  <div id="load-status" style="position:absolute;bottom:10px;font-size:10px;color:rgba(255,255,255,.4)">&#9203; Loading engine...</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
<script>

const OCEAN_FLOOR_Y=-80, WATER_SURFACE_Y=0, CITY_Z=900, MAX_SCALE=40;
const STAGES=[
  {name:'LARVA',scale:1,food:0,desc:'Find food on the ocean floor...'},
  {name:'HATCHLING',scale:2,food:6,desc:'You grow stronger...'},
  {name:'JUVENILE',scale:4,food:15,desc:'The deep trembles...'},
  {name:'HUNTER',scale:7,food:30,desc:'Predators become prey'},
  {name:'APEX',scale:12,food:50,desc:'Nothing escapes you'},
  {name:'LEVIATHAN',scale:20,food:75,desc:'RISE TO THE SURFACE'},
  {name:'GOCHILLA',scale:32,food:100,desc:'ANNIHILATE EVERYTHING'},
];

let gameState='title',playerScale=1,foodEaten=0,currentStage=0;
let surfaced=false,cityReached=false,destroyedBuildings=0,totalBuildings=0;
const keys={};
let joyX=0,joyY=0,camDX=0,camDY=0,swimUp=false,swimDown=false;
let playerYaw=0,playerPitch=0,animTime=0;
const playerVel=new THREE.Vector3();

// ========== RENDERER ==========
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.prepend(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a0848,0.004);
scene.background=new THREE.Color(0x0a0430);
const camera=new THREE.PerspectiveCamera(65,window.innerWidth/window.innerHeight,0.1,2000);

// ========== COLORFUL LIGHTS ==========
scene.add(new THREE.AmbientLight(0x8866cc,0.8));

const dirLight=new THREE.DirectionalLight(0xccaaff,0.8);
dirLight.position.set(-100,200,-100);dirLight.castShadow=true;
dirLight.shadow.mapSize.set(1024,1024);
dirLight.shadow.camera.left=-300;dirLight.shadow.camera.right=300;
dirLight.shadow.camera.top=300;dirLight.shadow.camera.bottom=-300;
scene.add(dirLight);

// Colorful underwater point lights
const uwLights=[];
const lightColors=[0x8800ff,0x00ff88,0xff4400,0x0088ff,0xff00aa,0x44ff00,0xffaa00];
for(let i=0;i<7;i++){
  const l=new THREE.PointLight(lightColors[i],2,80);
  l.position.set((Math.random()-.5)*200,OCEAN_FLOOR_Y+10+Math.random()*50,(Math.random()-.5)*200);
  scene.add(l);uwLights.push(l);
}

// Player follow light
const playerLight=new THREE.PointLight(0x6644cc,3,60);
scene.add(playerLight);

// God rays with color
for(let i=0;i<15;i++){
  const c=[0x8844ff,0x44ffaa,0xff6644,0x4488ff,0xff44aa][i%5];
  const ray=new THREE.Mesh(
    new THREE.PlaneGeometry(2+Math.random()*4,80),
    new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.06,side:THREE.DoubleSide})
  );
  ray.position.set((Math.random()-.5)*300,OCEAN_FLOOR_Y+40,(Math.random()-.5)*300);
  ray.rotation.y=Math.random()*Math.PI;ray.name='godray';scene.add(ray);
}

// ========== PROCEDURAL CREATURE NAME GENERATOR ==========
const prefixes=['Glim','Zor','Neb','Kra','Vel','Pho','Xen','Azu','Cri','Lum','Vor','Pyx','Qua','Thi','Fla','Bor','Dri','Gal','Hy','Ion'];
const suffixes=['fish','pod','fin','jaw','ray','shell','worm','blob','squid','jelly','maw','fang','tail','wing','claw','spine','eye','horn','lurk','drift'];
const adjectives=['Luminous','Prismatic','Abyssal','Ethereal','Crimson','Violet','Emerald','Obsidian','Spectral','Venomous','Ancient','Colossal','Phantom','Iridescent','Molten','Frozen','Shadow','Thunder','Crystal','Nebula'];

function randomName(){
  return adjectives[Math.floor(Math.random()*adjectives.length)]+' '+
    prefixes[Math.floor(Math.random()*prefixes.length)]+
    suffixes[Math.floor(Math.random()*suffixes.length)];
}

// ========== PROCEDURAL COLOR PALETTES ==========
function vibrantColor(){
  const h=Math.random();
  const s=0.6+Math.random()*0.4;
  const l=0.4+Math.random()*0.3;
  return new THREE.Color().setHSL(h,s,l);
}

function glowMat(baseH){
  const c=new THREE.Color().setHSL(baseH||Math.random(),0.8,0.5);
  return new THREE.MeshStandardMaterial({
    color:c,roughness:0.3,metalness:0.4,
    emissive:c.clone().multiplyScalar(0.3),
    emissiveIntensity:0.5
  });
}

function translucentMat(baseH){
  const c=new THREE.Color().setHSL(baseH||Math.random(),0.7,0.5);
  return new THREE.MeshStandardMaterial({
    color:c,roughness:0.1,transparent:true,opacity:0.4+Math.random()*0.3,
    emissive:c.clone().multiplyScalar(0.4),emissiveIntensity:0.4
  });
}

// ========== PROCEDURAL CREATURE GENERATOR ==========
function proceduralCreature(sizeClass){
  // sizeClass: 0=tiny, 1=small, 2=medium, 3=large, 4=huge, 5=boss
  const g=new THREE.Group();
  const hue=Math.random();
  const mainMat=glowMat(hue);
  const accentMat=glowMat((hue+0.3+Math.random()*0.4)%1);
  const glowM=translucentMat((hue+0.5)%1);

  const bodyType=Math.floor(Math.random()*6);
  const baseSize=0.2+sizeClass*0.4;

  // --- BODY ---
  let bodyMesh;
  switch(bodyType){
    case 0:{ // Fish-like
      const geo=new THREE.SphereGeometry(baseSize,8,6);
      geo.scale(0.7+Math.random()*0.5,0.5+Math.random()*0.3,1.5+Math.random());
      bodyMesh=new THREE.Mesh(geo,mainMat);break;
    }
    case 1:{ // Jellyfish-like
      const geo=new THREE.SphereGeometry(baseSize,10,8,0,Math.PI*2,0,Math.PI*0.6);
      bodyMesh=new THREE.Mesh(geo,glowM);
      // Tentacles
      const tCount=6+Math.floor(Math.random()*12);
      for(let i=0;i<tCount;i++){
        const angle=i/tCount*Math.PI*2;
        const tLen=baseSize*2+Math.random()*baseSize*3;
        const segs=4+Math.floor(Math.random()*4);
        for(let s=0;s<segs;s++){
          const t=s/segs;
          const seg=new THREE.Mesh(
            new THREE.SphereGeometry(0.03+baseSize*0.08*(1-t),4,4),
            Math.random()>.5?accentMat:glowM
          );
          seg.position.set(Math.cos(angle)*baseSize*0.6,-(t*tLen)-baseSize*0.3,Math.sin(angle)*baseSize*0.6);
          seg.name='tent';g.add(seg);
        }
      }
      break;
    }
    case 2:{ // Serpent/eel
      const segs=8+Math.floor(Math.random()*12);
      const length=baseSize*6+Math.random()*baseSize*4;
      for(let i=0;i<segs;i++){
        const t=i/segs;
        const r=baseSize*(0.8-t*0.5)*(0.5+Math.random()*0.3);
        const seg=new THREE.Mesh(new THREE.SphereGeometry(r,6,4),i%3===0?accentMat:mainMat);
        seg.position.z=-t*length;seg.name='sseg_'+i;g.add(seg);
      }
      bodyMesh=null;break;
    }
    case 3:{ // Crab/spider
      const geo=new THREE.SphereGeometry(baseSize,8,6);
      geo.scale(1.3,0.5,1);
      bodyMesh=new THREE.Mesh(geo,mainMat);
      const legCount=4+Math.floor(Math.random()*4);
      for(let s of[-1,1])for(let i=0;i<legCount;i++){
        const leg=new THREE.Mesh(
          new THREE.CylinderGeometry(baseSize*0.06,baseSize*0.04,baseSize*1.5,4),
          accentMat
        );
        leg.position.set(s*(baseSize+0.1),-baseSize*0.3,-baseSize+i*baseSize*0.5);
        leg.rotation.z=s*0.8;leg.name='leg';g.add(leg);
      }
      // Claws
      for(let s of[-1,1]){
        const claw=new THREE.Mesh(new THREE.BoxGeometry(baseSize*0.4,baseSize*0.2,baseSize*0.3),accentMat);
        claw.position.set(s*(baseSize*1.2),0,baseSize*0.5);claw.name='claw';g.add(claw);
      }
      break;
    }
    case 4:{ // Ray/flat
      const geo=new THREE.SphereGeometry(baseSize,10,6);
      geo.scale(2+Math.random(),0.2+Math.random()*0.15,1+Math.random()*0.5);
      bodyMesh=new THREE.Mesh(geo,mainMat);
      // Wing flaps
      for(let s of[-1,1]){
        const wing=new THREE.Mesh(
          new THREE.SphereGeometry(baseSize*0.8,6,4),
          accentMat
        );
        wing.scale.set(1.5,0.15,1);
        wing.position.set(s*baseSize*1.8,0,0);wing.name='wing';g.add(wing);
      }
      // Tail
      const tail=new THREE.Mesh(new THREE.CylinderGeometry(baseSize*0.05,0.01,baseSize*3,4),mainMat);
      tail.rotation.x=Math.PI/2;tail.position.z=-baseSize*2;g.add(tail);
      break;
    }
    default:{ // Blob/octopus
      const geo=new THREE.SphereGeometry(baseSize,8,8);
      geo.scale(0.8+Math.random()*0.4,1+Math.random()*0.5,0.8+Math.random()*0.4);
      bodyMesh=new THREE.Mesh(geo,glowM);
      const armCount=4+Math.floor(Math.random()*6);
      for(let i=0;i<armCount;i++){
        const angle=i/armCount*Math.PI*2;
        const armSegs=4+Math.floor(Math.random()*4);
        const armLen=baseSize*1.5+Math.random()*baseSize;
        for(let s=0;s<armSegs;s++){
          const t=s/armSegs;
          const seg=new THREE.Mesh(
            new THREE.SphereGeometry(baseSize*0.15*(1-t*0.6),5,4),
            s%2===0?mainMat:accentMat
          );
          seg.position.set(Math.cos(angle)*(baseSize*0.5+t*armLen),-baseSize*0.3-t*armLen*0.3,Math.sin(angle)*(baseSize*0.5+t*armLen));
          seg.name='arm_'+i+'_'+s;g.add(seg);
        }
      }
    }
  }

  if(bodyMesh){bodyMesh.castShadow=true;g.add(bodyMesh);}

  // --- EYES (random count, placement, size) ---
  const eyeCount=Math.random()>.3?2:Math.floor(1+Math.random()*5);
  const eyeGlowColor=new THREE.Color().setHSL(Math.random(),0.9,0.6);
  const eyeMat=new THREE.MeshStandardMaterial({color:eyeGlowColor,emissive:eyeGlowColor,emissiveIntensity:2});
  for(let i=0;i<eyeCount;i++){
    const eyeSize=baseSize*(0.06+Math.random()*0.12);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(eyeSize,6,4),eyeMat);
    if(eyeCount===2){
      eye.position.set((i===0?-1:1)*baseSize*0.4,baseSize*0.3,baseSize*0.6);
    }else{
      eye.position.set((Math.random()-.5)*baseSize,(Math.random()-.3)*baseSize,baseSize*(0.3+Math.random()*0.4));
    }
    g.add(eye);
  }

  // --- FINS/SPINES (random) ---
  if(Math.random()>.3){
    const finCount=1+Math.floor(Math.random()*5);
    for(let i=0;i<finCount;i++){
      const fin=new THREE.Mesh(
        new THREE.ConeGeometry(baseSize*0.15,baseSize*(0.3+Math.random()*0.8),4),
        accentMat
      );
      fin.position.set(
        (Math.random()-.5)*baseSize*0.5,
        baseSize*(0.3+Math.random()*0.5),
        (Math.random()-.5)*baseSize
      );
      fin.rotation.set(Math.random()-.5,0,Math.random()-.5);
      g.add(fin);
    }
  }

  // --- TAIL ---
  if(bodyType!==1&&bodyType!==2&&Math.random()>.2){
    const tailType=Math.floor(Math.random()*3);
    if(tailType===0){
      const tail=new THREE.Mesh(new THREE.ConeGeometry(baseSize*0.2,baseSize*0.6,4),accentMat);
      tail.rotation.x=Math.PI/2;tail.position.z=-baseSize*1.2;tail.name='tail';g.add(tail);
    }else if(tailType===1){
      for(let s of[-1,1]){
        const fluke=new THREE.Mesh(new THREE.ConeGeometry(baseSize*0.15,baseSize*0.5,4),accentMat);
        fluke.position.set(s*baseSize*0.3,0,-baseSize*1.2);fluke.rotation.z=s;fluke.name='fluke';g.add(fluke);
      }
    }else{
      const fan=new THREE.Mesh(new THREE.CircleGeometry(baseSize*0.4,6),accentMat.clone());
      fan.material.side=THREE.DoubleSide;
      fan.position.z=-baseSize*1;fan.name='fantail';g.add(fan);
    }
  }

  // --- BIOLUMINESCENT SPOTS ---
  if(Math.random()>.4){
    const spotCount=3+Math.floor(Math.random()*8);
    const spotColor=new THREE.Color().setHSL(Math.random(),0.9,0.7);
    const spotMat=new THREE.MeshStandardMaterial({color:spotColor,emissive:spotColor,emissiveIntensity:1.5,transparent:true,opacity:0.8});
    for(let i=0;i<spotCount;i++){
      const spot=new THREE.Mesh(new THREE.SphereGeometry(baseSize*0.04+Math.random()*baseSize*0.06,4,4),spotMat);
      spot.position.set((Math.random()-.5)*baseSize*1.5,(Math.random()-.5)*baseSize,(Math.random()-.5)*baseSize*1.5);
      spot.name='glow';g.add(spot);
    }
  }

  // --- ANTENNA/LURE ---
  if(Math.random()>.6){
    const stalk=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,baseSize),mainMat);
    stalk.position.set(0,baseSize*0.8,baseSize*0.3);stalk.rotation.z=0.3;g.add(stalk);
    const lureColor=new THREE.Color().setHSL(Math.random(),1,0.7);
    const lure=new THREE.Mesh(
      new THREE.SphereGeometry(baseSize*0.08,6,4),
      new THREE.MeshStandardMaterial({color:lureColor,emissive:lureColor,emissiveIntensity:3})
    );
    lure.position.set(baseSize*0.2,baseSize*1.2,baseSize*0.3);lure.name='lure';g.add(lure);
    const ll=new THREE.PointLight(lureColor,0.8,baseSize*8);
    ll.position.copy(lure.position);g.add(ll);
  }

  // Calculate points and minScale based on sizeClass
  const points=[1,2,3,5,8,15][sizeClass]||1;
  const minScale=[-1,0,2,5,10,18][sizeClass]||-1;
  const name=randomName();

  return{group:g,points,minScale,name,sizeClass,baseSize};
}

// ========== PLAYER (GOCHILLA) ==========
const playerGroup=new THREE.Group();scene.add(playerGroup);
function buildGochilla(){
  while(playerGroup.children.length)playerGroup.remove(playerGroup.children[0]);
  const M={
    body:new THREE.MeshStandardMaterial({color:0x1a2a1a,roughness:.7,metalness:.2}),
    dark:new THREE.MeshStandardMaterial({color:0x0a1a0a,roughness:.8}),
    belly:new THREE.MeshStandardMaterial({color:0x2a3a2a,roughness:.6}),
    spine:new THREE.MeshStandardMaterial({color:0x8800ff,roughness:.3,emissive:0x440088,emissiveIntensity:.5}),
    eye:new THREE.MeshStandardMaterial({color:0xff0040,emissive:0xff0040,emissiveIntensity:2}),
    teeth:new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3}),
    claw:new THREE.MeshStandardMaterial({color:0x111111,roughness:.5}),
  };
  // Body
  playerGroup.add(new THREE.Mesh(new THREE.CapsuleGeometry(0.8,2.2,8,12),M.body));
  const belly=new THREE.Mesh(new THREE.CapsuleGeometry(0.65,1.8,6,10),M.belly);belly.position.z=0.15;playerGroup.add(belly);
  // Head
  const hg=new THREE.SphereGeometry(0.65,10,8);hg.scale(1.2,.9,1);const head=new THREE.Mesh(hg,M.body);head.position.y=1.7;head.castShadow=true;playerGroup.add(head);
  playerGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.5,0.35,0.7),M.body),{position:new THREE.Vector3(0,1.55,0.55)}));
  playerGroup.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(0.45,0.15,0.6),M.dark),{position:new THREE.Vector3(0,1.35,0.5)}));
  for(let i=0;i<6;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.12,4),M.teeth);t.position.set(-0.15+i*0.06,1.4,0.75);t.rotation.x=Math.PI;playerGroup.add(t);}
  for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.1,4),M.teeth);t.position.set(-0.12+i*0.06,1.35,0.72);playerGroup.add(t);}
  for(let s of[-1,1]){
    const e=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),M.eye);e.position.set(s*0.4,1.85,0.35);playerGroup.add(e);
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,4),M.claw);p.position.set(s*0.4,1.85,0.45);playerGroup.add(p);
  }

function buildOceanFloor(){
  const floorGeo=new THREE.PlaneGeometry(1200,1200,60,60);floorGeo.rotateX(-Math.PI/2);
  const v=floorGeo.attributes.position;
  for(let i=0;i<v.count;i++)v.setY(i,Math.sin(v.getX(i)*0.05)*2+Math.cos(v.getZ(i)*0.07)*1.5+Math.sin(v.getX(i)*0.02+v.getZ(i)*0.03)*4);
  floorGeo.computeVertexNormals();
  // Colorful sand with vertex colors
  const colors=new Float32Array(v.count*3);
  for(let i=0;i<v.count;i++){
    const c=new THREE.Color().setHSL(0.7+Math.sin(v.getX(i)*0.01)*0.15,0.3,0.25+Math.sin(v.getZ(i)*0.02)*0.1);
    colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b;
  }
  floorGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const floor=new THREE.Mesh(floorGeo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.9}));
  floor.position.y=OCEAN_FLOOR_Y;floor.receiveShadow=true;scene.add(floor);

  // Colorful rocks
  for(let i=0;i<80;i++){
    const c=new THREE.Color().setHSL(Math.random(),0.3+Math.random()*0.3,0.2+Math.random()*0.15);
    const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(1,1),new THREE.MeshStandardMaterial({color:c,roughness:0.9}));
    const s=0.5+Math.random()*3;rock.scale.set(s,s*0.6,s);
    rock.position.set((Math.random()-.5)*500,OCEAN_FLOOR_Y+s*0.3,(Math.random()-.5)*500);
    rock.rotation.y=Math.random()*Math.PI;rock.castShadow=true;scene.add(rock);
  }

  // Glowing coral
  const coralHues=[0,0.05,0.15,0.3,0.55,0.7,0.85];
  for(let i=0;i<120;i++){
    const hue=coralHues[Math.floor(Math.random()*coralHues.length)];
    const cc=new THREE.Color().setHSL(hue,0.8,0.5);
    const mat=new THREE.MeshStandardMaterial({color:cc,roughness:0.6,emissive:cc.clone().multiplyScalar(0.2),emissiveIntensity:0.4});
    let coral;
    const type=Math.floor(Math.random()*4);
    if(type===0){coral=new THREE.Mesh(new THREE.SphereGeometry(0.5+Math.random(),8,6),mat);coral.scale.y=0.6;}
    else if(type===1){
      coral=new THREE.Group();
      for(let b=0;b<5+Math.floor(Math.random()*4);b++){
        const branch=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.1,0.6+Math.random()*0.8,5),mat);
        branch.position.set((Math.random()-.5)*0.5,0.3,(Math.random()-.5)*0.5);
        branch.rotation.set((Math.random()-.5)*0.5,0,(Math.random()-.5)*0.5);coral.add(branch);
        const sb=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.05,0.3,4),mat);sb.position.y=0.35;sb.rotation.z=Math.random();branch.add(sb);
      }
    }else if(type===2){
      coral=new THREE.Mesh(new THREE.TorusGeometry(0.4+Math.random()*0.3,0.1+Math.random()*0.08,6,8),mat);
      coral.rotation.x=Math.PI/2+Math.random()*0.5;
    }else{
      coral=new THREE.Mesh(new THREE.ConeGeometry(0.2+Math.random()*0.3,1+Math.random()*1.5,6),mat);
    }
    coral.position.set((Math.random()-.5)*400,OCEAN_FLOOR_Y+0.5,(Math.random()-.5)*400);
    coral.rotation.y=Math.random()*Math.PI;scene.add(coral);
  }

  // Glowing kelp
  for(let i=0;i<50;i++){
    const hue=0.25+Math.random()*0.15;
    const kc=new THREE.Color().setHSL(hue,0.6,0.35);
    const kelpH=8+Math.random()*20;
    const kelpGeo=new THREE.PlaneGeometry(0.8,kelpH,1,8);
    const kv=kelpGeo.attributes.position;
    for(let j=0;j<kv.count;j++)kv.setX(j,kv.getX(j)+Math.sin(kv.getY(j)*0.3+i)*0.8);
    const kelp=new THREE.Mesh(kelpGeo,new THREE.MeshStandardMaterial({color:kc,emissive:kc.clone().multiplyScalar(0.15),emissiveIntensity:0.3,roughness:0.7,side:THREE.DoubleSide}));
    kelp.position.set((Math.random()-.5)*400,OCEAN_FLOOR_Y+kelpH/2,(Math.random()-.5)*400);
    kelp.rotation.y=Math.random()*Math.PI;kelp.name='kelp';scene.add(kelp);
  }

  // Glowing anemones
  for(let i=0;i<40;i++){
    const ah=Math.random();
    const ac=new THREE.Color().setHSL(ah,0.8,0.5);
    const anemone=new THREE.Group();
    anemone.add(new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.25,0.25,8),new THREE.MeshStandardMaterial({color:ac,roughness:0.6})));
    for(let t=0;t<10+Math.floor(Math.random()*8);t++){
      const angle=t/14*Math.PI*2;
      const tc=new THREE.Color().setHSL((ah+0.1)%1,0.9,0.6);
      const tent=new THREE.Mesh(new THREE.CylinderGeometry(0.015,0.025,0.3+Math.random()*0.3,4),new THREE.MeshStandardMaterial({color:tc,emissive:tc,emissiveIntensity:0.5}));

      tent.rotation.set((Math.random()-.5)*0.5,0,(Math.random()-.5)*0.5);tent.name='atent';anemone.add(tent);
    }
    anemone.position.set((Math.random()-.5)*300,OCEAN_FLOOR_Y+0.12,(Math.random()-.5)*300);scene.add(anemone);
  }
}

const sizeLabel=document.getElementById('size-label'),sizeBar=document.getElementById('size-bar'),foodCountEl=document.getElementById('food-count'),depthDisplay=document.getElementById('depth-display'),stageAnnounce=document.getElementById('stage-announce'),creatureLabel=document.getElementById('creature-label');

// ========== MAIN LOOP ==========
const clock=new THREE.Clock();
let spawnTimer=0;

function update(){
  if(gameState!=='playing')return;
  const dt=Math.min(clock.getDelta(),0.05);
  animTime+=dt;

  playerYaw-=camDX*0.003;playerPitch-=camDY*0.003;
  playerPitch=Math.max(-1.2,Math.min(1.2,playerPitch));camDX=0;camDY=0;

  const forward=new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0),playerYaw);
  const right=new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),playerYaw);
  const isUW=playerGroup.position.y<WATER_SURFACE_Y;
  const speed=(isUW?15:20)*Math.max(1,playerScale*.3);
  const accel=speed*dt;

  let mx=joyX,my=joyY;
  if(keys['w'])my=1;if(keys['s'])my=-1;if(keys['a'])mx=-1;if(keys['d'])mx=1;
  if(my)playerVel.add(forward.clone().multiplyScalar(accel*my*(my<0?.6:1)));
  if(mx)playerVel.add(right.clone().multiplyScalar(accel*mx*.7));
  if((swimUp||keys[' '])&&isUW)playerVel.y+=accel*.8;
  if((swimDown||keys['shift'])&&isUW)playerVel.y-=accel*.8;
  if(!isUW&&(swimDown||keys['shift']))playerVel.y-=accel*.5;

  playerVel.multiplyScalar(isUW?.92:.95);
  if(!isUW)playerVel.y-=20*dt;
  playerGroup.position.add(playerVel.clone().multiplyScalar(dt*60));

  const floorY=OCEAN_FLOOR_Y+2*playerScale;
  if(playerGroup.position.y<floorY){playerGroup.position.y=floorY;playerVel.y=Math.max(0,playerVel.y);}
  if(!isUW&&playerGroup.position.y<playerScale*2){playerGroup.position.y=playerScale*2;playerVel.y=Math.max(0,playerVel.y);}

  playerGroup.rotation.y=playerYaw;playerGroup.scale.setScalar(playerScale);

  // Animate limbs
  const ws=playerVel.length();
  if(ws>.05){const ls=Math.sin(animTime*5)*.4;playerGroup.children.forEach(c=>{if(c.name==='legL'||c.name==='footL')c.rotation.x=ls;if(c.name==='legR'||c.name==='footR')c.rotation.x=-ls;if(c.name==='armL')c.rotation.x=-ls*.5;if(c.name==='armR')c.rotation.x=ls*.5;});}
  playerGroup.children.forEach(c=>{if(c.name&&c.name.startsWith('tail_')){const i=parseInt(c.name.split('_')[1]);c.position.x=Math.sin(animTime*3+i*.5)*.15*(i+1);}});

  // Camera
  const camDist2=5+playerScale*2.5,camH=2+playerScale*1.2;
  const camOff=new THREE.Vector3(0,camH,-camDist2);
  camOff.applyAxisAngle(new THREE.Vector3(1,0,0),playerPitch*.3);
  camOff.applyAxisAngle(new THREE.Vector3(0,1,0),playerYaw);
  camera.position.copy(playerGroup.position).add(camOff);
  const lookT=playerGroup.position.clone();lookT.y+=playerScale*1.5;lookT.add(forward.clone().multiplyScalar(playerScale*2));
  camera.lookAt(lookT);

  // Atmosphere - much brighter & more colorful underwater
  if(isUW){
    const depthRatio=Math.max(0,Math.min(1,(-playerGroup.position.y)/80));
    const fogH=0.7-depthRatio*0.15;
    scene.fog.color.setHSL(fogH,0.5,0.15+depthRatio*0.05);
    scene.fog.density=0.003/Math.max(1,playerScale*.3);
    scene.background.setHSL(fogH,0.6,0.08+depthRatio*0.04);
    rain.visible=false;uwParticles.visible=true;
  }else{
    scene.fog.color.set(0x3a4050);scene.fog.density=0.003;scene.background.set(0x2a3040);
    rain.visible=true;uwParticles.visible=false;
  }

  // Water
  const wPos=waterMesh.geometry.attributes.position;
  for(let i=0;i<wPos.count;i++)wPos.setY(i,Math.sin(wPos.getX(i)*.03+animTime*.8)*.8+Math.cos(wPos.getZ(i)*.04+animTime*.6)*.5);
  wPos.needsUpdate=true;

  // Rain
  if(rain.visible){const rpp=rain.geometry.attributes.position;for(let i=0;i<rainCount;i++){rpp.setY(i,rpp.getY(i)-rv2[i]);if(rpp.getY(i)<0){rpp.setY(i,100+Math.random()*50);rpp.setX(i,playerGroup.position.x+(Math.random()-.5)*400);rpp.setZ(i,playerGroup.position.z+(Math.random()-.5)*400);}}rpp.needsUpdate=true;}

  // Lights follow player
  playerLight.position.copy(playerGroup.position);playerLight.position.y+=10;
  playerLight.intensity=isUW?3:0;playerLight.distance=40+playerScale*5;
  uwParticles.position.x=playerGroup.position.x;uwParticles.position.z=playerGroup.position.z;

  // Pulse underwater colored lights
  for(let i=0;i<uwLights.length;i++){
    uwLights[i].intensity=1.5+Math.sin(animTime*2+i*1.3)*.8;
    uwLights[i].position.y=OCEAN_FLOOR_Y+15+Math.sin(animTime*.5+i)*10;
  }

  // Animate environment
  scene.children.forEach(c=>{
    if(c.name==='kelp')c.rotation.z=Math.sin(animTime+c.position.x)*.1;
    if(c.name==='godray')c.material.opacity=0.04+Math.sin(animTime*.5+c.position.x*.01)*.02;
  });

  // Spawn more creatures
  spawnTimer+=dt;
  if(spawnTimer>10&&foods.filter(f=>f.alive).length<50){
    spawnTimer=0;
    const range=200+playerScale*10;const px=playerGroup.position.x,pz=playerGroup.position.z;
    for(let i=0;i<10;i++){
      let sc=Math.floor(Math.random()*3); // mostly small
      if(Math.random()<0.2)sc=3;
      if(Math.random()<0.08)sc=4;
      if(Math.random()<0.03&&playerScale>15)sc=5;
      const pos=new THREE.Vector3(px+(Math.random()-.5)*range,OCEAN_FLOOR_Y+2+Math.random()*60,pz+(Math.random()-.5)*range);
      spawnCreature(pos,sc);
    }
  }

  // Update creatures
  let closestFood=null,closestDist=Infinity;
  for(const f of foods){
    if(!f.alive)continue;
    f.wobble+=dt*2;
    const m=f.mesh;
    m.position.x+=f.vel.x*dt*60+Math.sin(f.wobble+m.id)*.02;
    m.position.z+=f.vel.z*dt*60+Math.cos(f.wobble+m.id)*.02;
    m.position.y=f.baseY+Math.sin(animTime+f.wobble)*1.5;

    // Animate parts
    m.children.forEach(c=>{
      if(c.name==='tent')c.position.y+=Math.sin(animTime*2+c.position.x*5)*.003;
      if(c.name==='wing')c.rotation.z=Math.sin(animTime*2+f.wobble)*.2;
      if(c.name==='tail'||c.name==='fantail')c.rotation.y=Math.sin(animTime*5+f.wobble)*.3;
      if(c.name==='fluke')c.rotation.x=Math.sin(animTime*2+f.wobble)*.2;
      if(c.name==='leg')c.rotation.x=Math.sin(animTime*4+c.position.z*3)*.3;
      if(c.name==='claw')c.scale.x=0.8+Math.sin(animTime*3)*.2;
      if(c.name==='lure')c.position.y+=Math.sin(animTime*3)*.002;
      if(c.name==='glow')c.material.emissiveIntensity=1+Math.sin(animTime*4+c.position.x*10)*.8;
      if(c.name&&c.name.startsWith('sseg_')){const i=parseInt(c.name.split('_')[1]);c.position.x=Math.sin(animTime*2+i*.5)*.15;}
      if(c.name&&c.name.startsWith('arm_')){const[_,ai,si]=c.name.split('_');c.position.y+=Math.sin(animTime*2+parseInt(ai)+parseInt(si)*.5)*.002;}
    });

    // Slowly rotate fish-types
    if(f.sizeClass<=2)m.rotation.y+=dt*0.3;

    // Floor/ceiling
    if(m.position.y<OCEAN_FLOOR_Y+1){m.position.y=OCEAN_FLOOR_Y+1;f.vel.y*=-1;}
    if(m.position.y>WATER_SURFACE_Y-1){m.position.y=WATER_SURFACE_Y-1;f.vel.y*=-1;}

    // Eat
    const dist=playerGroup.position.distanceTo(m.position);
    const eatRange=playerScale*2.5;
    const canEat=playerScale>=f.minScale+1;
    if(dist<eatRange&&canEat){
      f.alive=false;foodGroup.remove(m);
      m.traverse(c=>{if(c.geometry)c.geometry.dispose();if(c.material){if(Array.isArray(c.material))c.material.forEach(m=>m.dispose());else c.material.dispose();}});
      foodEaten+=f.points;spawnBubbles(m.position.clone(),12);
      showLabel('ATE: '+f.label+' (+'+f.points+')');
      const ts=STAGES.findLast(s=>foodEaten>=s.food);
      if(ts){playerScale=Math.min(MAX_SCALE,ts.scale+(foodEaten-ts.food)*.08);const si=STAGES.indexOf(ts);if(si>currentStage){currentStage=si;announce(ts.name+'<br>'+ts.desc);}}
    }
    if(dist<closestDist){closestDist=dist;closestFood=f;}
  }
  for(let i=foods.length-1;i>=0;i--)if(!foods[i].alive)foods.splice(i,1);

  // Labels
  if(labelTimer>0)labelTimer--;
  else if(closestFood&&closestDist<30+playerScale*3){
    const canEat=playerScale>=closestFood.minScale+1;
    showLabel(closestFood.label+(canEat?' [EAT]':' [TOO BIG]'));
  }else creatureLabel.style.opacity=0;

  // Bubbles
  for(let i=bubbles.length-1;i>=0;i--){const b=bubbles[i];b.position.add(b.userData.vel.clone().multiplyScalar(dt*60));b.userData.life-=dt*60;b.material.opacity=Math.max(0,b.userData.life/60);if(b.userData.life<=0){scene.remove(b);b.geometry.dispose();b.material.dispose();bubbles.splice(i,1);}}
  // Debris
  for(let i=debrisList.length-1;i>=0;i--){const d=debrisList[i];d.position.add(d.userData.vel.clone().multiplyScalar(dt));d.userData.vel.y-=15*dt;d.rotation.x+=d.userData.rotVel.x;d.rotation.z+=d.userData.rotVel.z;if(d.position.y<.1){d.position.y=.1;d.userData.vel.y=0;d.userData.vel.x*=.9;d.userData.vel.z*=.9;}d.userData.life-=dt*60;if(d.userData.life<=0){scene.remove(d);d.geometry.dispose();debrisList.splice(i,1);}}

  // City
  const distToCity=playerGroup.position.distanceTo(cityGroup.position);
  if(playerScale>12&&distToCity<400){
    if(!cityReached){cityReached=true;announce('NEW YORK CITY<br>DESTROY EVERYTHING');}
    for(const bd of buildingData){if(bd.destroyed)continue;const bw=bd.mesh.position.clone().add(cityGroup.position);const d=playerGroup.position.distanceTo(bw);if(d<playerScale*3){bd.health-=dt*200*playerScale;bd.mesh.position.x=bd.origPos.x+(Math.random()-.5)*2;bd.mesh.position.z=bd.origPos.z+(Math.random()-.5)*2;if(bd.health<=0){bd.destroyed=true;destroyedBuildings++;spawnDebris(bw,bd.width);bd.mesh.scale.y=.1;bd.mesh.position.y=bd.height*.05;bd.mesh.material.color.set(0x1a1a1a);}}}
    cityGroup.children.forEach(c=>{if(c.name==='car'||c.name==='person'){const cw=c.position.clone().add(cityGroup.position);const dp=playerGroup.position.distanceTo(cw);if(dp<playerScale*8){c.userData.fleeing=true;const fd=cw.clone().sub(playerGroup.position).normalize();const spd=c.name==='car'?30:(c.userData.speed||.5)*15;c.userData.vel.copy(fd.multiplyScalar(spd));c.userData.vel.y=0;}if(c.userData.fleeing){c.position.add(c.userData.vel.clone().multiplyScalar(dt));if(c.name==='person')c.rotation.z=Math.sin(animTime*15)*.2;}}});
  }
  if(!surfaced&&playerGroup.position.y>WATER_SURFACE_Y&&playerScale>10){surfaced=true;announce('YOU HAVE SURFACED<br>THE CITY AWAITS');}

  // UI
  const stage=STAGES[currentStage];sizeLabel.textContent='SIZE: '+stage.name;
  const ns=STAGES[currentStage+1];sizeBar.style.width=Math.min(100,ns?((foodEaten-stage.food)/(ns.food-stage.food))*100:100)+'%';
  foodCountEl.textContent='CONSUMED: '+foodEaten;
  const depth=Math.max(0,-playerGroup.position.y).toFixed(0);const alt=Math.max(0,playerGroup.position.y).toFixed(0);
  depthDisplay.innerHTML=isUW?`DEPTH: ${depth}m<br>SCALE: x${playerScale.toFixed(1)}`:`ALT: ${alt}m<br>SCALE: x${playerScale.toFixed(1)}<br>DESTROYED: ${destroyedBuildings}/${totalBuildings}`;
}

function render(){requestAnimationFrame(render);update();renderer.render(scene,camera);}
window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight;camera.updateProjectionMatrix();renderer.setSize(window.innerWidth,window.innerHeight);});
clock.start();render();
</script>
</body>
</html>
